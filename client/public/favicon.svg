<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Clean White Background -->
  <rect width="64" height="64" fill="#ffffff" />

  <!-- Black Rounded Pill Container (Exact Logo Badge Style) -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="#18181b" />

  <!-- Exact Geometric Lowercase 'b' from buildingit Logo -->
  <g fill="#ffffff">
    <!-- Vertical Stem -->
    <rect x="18" y="16" width="7.5" height="32" rx="1" />
    <!-- Outer Circular Bowl -->
    <circle cx="33.5" cy="35" r="13" />
  </g>
  <!-- Inner Circular Counter Cutout -->
  <circle cx="33.5" cy="35" r="5.5" fill="#18181b" />
</svg>
